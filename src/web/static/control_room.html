<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haven Control Room (Web)</title>
  <style>
    body { font-family: Arial, sans-serif; background: #071229; color: #e6f7ff; }
    .container { max-width: 1100px; margin: 24px auto; }
    .card { background: #0d2140; padding: 16px; border-radius: 8px; margin-bottom: 12px; }
    button { padding: 8px 12px; margin: 6px; }
    input, select, textarea { padding: 8px; width: 100%; border-radius: 6px; border: 1px solid #134; background: #081426; color: #e6f7ff; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Haven Control Room (Web)</h1>

    <div class="card">
      <h2>Data Provider & Status</h2>
      <div id="status">Checking...</div>
      <button onclick="loadSystems()">Reload Systems</button>
      <button onclick="generateMap()">Generate Map</button>
      <button onclick="openMap()">Open Latest Map</button>
    </div>

    <div class="card">
      <h2>Create System</h2>
      <form id="createSystemForm" onsubmit="createSystem(event)">
        <label>System Name</label>
        <input id="sysName" required>
        <label>Region</label>
        <input id="sysRegion" required>
        <label>X, Y, Z</label>
        <input id="sysX" placeholder="x" required>
        <input id="sysY" placeholder="y" required>
        <input id="sysZ" placeholder="z" required>
        <label>Attributes</label>
        <input id="sysAttrs">
        <button type="submit">Create</button>
      </form>
    </div>

    <div class="card">
      <h2>Systems</h2>
      <div id="systemsList">Loading...</div>
    </div>

    <div class="card">
      <h2>Logs (Latest)</h2>
      <pre id="logs" style="height:200px; overflow:auto; background:#021020; padding:8px;">Loading...</pre>
    </div>

  </div>

  <script>
    async function status() {
      const r = await fetch('/api/status');
      const json = await r.json();
      document.getElementById('status').innerText = `OK - use_database=${json.use_database}`;
    }

    async function loadSystems() {
      document.getElementById('systemsList').innerText = 'Loading...';
      const r = await fetch('/api/systems');
      const json = await r.json();
      const list = json.systems || json; // pagination vs non
      const el = document.getElementById('systemsList');
      el.innerHTML = '';
      list.forEach(s => {
        const row = document.createElement('div');
        row.innerHTML = `<b>${s.name}</b> — ${s.region || ''} — ${s.x}, ${s.y}, ${s.z}`;
        el.appendChild(row);
      });
    }

    async function createSystem(ev) {
      ev.preventDefault();
      const name = document.getElementById('sysName').value.trim();
      const region = document.getElementById('sysRegion').value.trim();
      const x = parseFloat(document.getElementById('sysX').value);
      const y = parseFloat(document.getElementById('sysY').value);
      const z = parseFloat(document.getElementById('sysZ').value);
      const attrs = document.getElementById('sysAttrs').value || '';

      const body = {
        name,
        region,
        x, y, z,
        attributes: attrs,
        planets: []
      };

      const r = await fetch('/api/systems', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (r.ok) {
        alert('Created');
        loadSystems();
        document.getElementById('createSystemForm').reset();
      } else {
        alert('Failed to create');
      }
    }

    async function generateMap() {
      const r = await fetch('/api/generate_map', { method: 'POST' });
      const j = await r.json();
      alert('Queued: ' + j.status);
    }

    async function openMap() {
      window.open('/map/latest', '_blank');
    }

    async function loadLogs() {
      const r = await fetch('/api/logs');
      const j = await r.json();
      document.getElementById('logs').innerText = j.lines.join('');
    }

    window.onload = () => {
      status(); loadSystems(); loadLogs();
      setInterval(loadLogs, 5000);
    };

  </script>
</body>
</html>
