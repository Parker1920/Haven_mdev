<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Haven Control Room - Web (Haven-UI)</title>
  <link rel="stylesheet" href="/haven-ui/assets/style.css" />
  <link rel="manifest" href="/haven-ui/manifest.webmanifest">
  <meta name="theme-color" content="#0ea5e9">
</head>
<body>
  <div class="app container">
    <header>
      <h1>Haven Control Room (Web)</h1>
      <nav>
        <a href="index.html">Dashboard</a> |
        <a href="systems.html">Systems</a> |
        <a href="wizard.html">Create System</a> |
        <a href="tests.html">Test Manager</a> |
        <a href="logs.html">Logs</a> |
        <a href="settings.html">Settings</a> |
        <a href="rtai.html">AI Chat Monitor</a>
      </nav>
    </header>

    <main>
      <section>
        <h2>Quick Actions</h2>
        <button id="btnReload">Reload Systems</button>
        <button id="btnGenerate">Generate Map</button>
        <button id="btnOpenMap">Open Latest Map</button>
      </section>

      <section>
        <h2>Recent Systems</h2>
        <div id="systems"></div>
      </section>
      <section>
        <h2>Stats</h2>
        <div id="status">Checking...</div>
        <div id="stats">Stats...</div>
      </section>
    </main>

    <footer>
      <small>Haven-UI Web (local). Built for Pi 5 & Dual GPU training setups.</small>
    </footer>
  </div>

<script src="/haven-ui/spa.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/haven-ui/sw.js').then(()=>console.log('SW registered')).catch(()=>console.log('SW register failed'));
  }
</script>
</body>
</html>
